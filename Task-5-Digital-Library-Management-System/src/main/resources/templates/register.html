<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Register</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="panel narrow"><h1>Create account</h1><p class="error" th:if="${error}" th:text="${error}"></p><p class="success" th:if="${message}" th:text="${message}"></p>
<form th:action="@{/register}" th:object="${user}" method="post"><label>Full name</label><input th:field="*{name}" required><label>Username</label><input th:field="*{username}" required><label>Email</label><input type="email" th:field="*{email}" required><label>Password</label><input type="password" th:field="*{password}" minlength="8" required><button>Create account</button></form><a href="/login">Back to login</a></main></body></html>
