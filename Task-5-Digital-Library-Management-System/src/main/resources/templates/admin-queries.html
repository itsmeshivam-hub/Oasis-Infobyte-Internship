<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>User Queries</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><h1>User Queries</h1><table><tr><th>Member</th><th>Message</th><th>Date</th><th>Status</th><th>Action</th></tr><tr th:each="q:${queries}"><td th:text="${q.user.username}"></td><td th:text="${q.message}"></td><td th:text="${q.submittedAt}"></td><td th:text="${q.resolved ? 'Resolved' : 'Open'}"></td><td><form th:if="${!q.resolved}" method="post" th:action="@{/admin/queries/resolve/{id}(id=${q.id})}"><button>Resolve</button></form></td></tr></table></main></body></html>
