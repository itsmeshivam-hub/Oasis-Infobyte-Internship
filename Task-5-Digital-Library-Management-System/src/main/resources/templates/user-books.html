<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Catalogue</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><h1>Book Catalogue</h1><div th:replace="~{fragments :: messages}"></div>
<form method="get" action="/user/books" class="toolbar"><input name="q" placeholder="Search title or author"><button>Search</button><select name="category"><option value="">All categories</option><option th:each="c:${categories}" th:value="${c}" th:text="${c}"></option></select><button>Filter</button></form>
<table><tr><th>Title</th><th>Author</th><th>Category</th><th>Available</th><th>Action</th></tr><tr th:each="b:${books}"><td th:text="${b.title}"></td><td th:text="${b.author}"></td><td th:text="${b.category}"></td><td th:text="${b.availableQuantity}"></td><td><form th:if="${b.availableQuantity > 0}" method="post" th:action="@{/user/issue/{id}(id=${b.id})}"><button>Issue</button></form><form th:if="${b.availableQuantity == 0}" method="post" th:action="@{/user/reserve/{id}(id=${b.id})}"><button class="secondary">Reserve</button></form></td></tr></table></main></body></html>
