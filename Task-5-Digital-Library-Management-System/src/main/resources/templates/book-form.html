<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Book Form</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="panel"><h1 th:text="${book.id == null ? 'Add Book' : 'Edit Book'}"></h1>
<form th:action="@{/admin/books/save}" th:object="${book}" method="post"><input type="hidden" th:field="*{id}"><label>Title</label><input th:field="*{title}" required><label>Author</label><input th:field="*{author}" required><label>ISBN</label><input th:field="*{isbn}" required><label>Category</label><input th:field="*{category}" required><label>Total quantity</label><input type="number" min="0" th:field="*{quantity}" required><button>Save book</button></form></main></body></html>
