<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>My Loans</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><h1>My Loans</h1><div th:replace="~{fragments :: messages}"></div>
<table><tr><th>Book</th><th>Issue date</th><th>Due date</th><th>Status</th><th>Action</th></tr><tr th:each="l:${loans}"><td th:text="${l.book.title}"></td><td th:text="${l.issueDate}"></td><td th:text="${l.dueDate}"></td><td th:text="${l.returned ? 'Returned' : 'Issued'}"></td><td><form th:if="${!l.returned}" method="post" th:action="@{/user/return/{id}(id=${l.id})}"><button>Return</button></form></td></tr></table></main></body></html>
