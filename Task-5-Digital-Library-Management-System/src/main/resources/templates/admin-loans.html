<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Issued Books</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><h1>All Issued Books</h1><table><tr><th>Member</th><th>Book</th><th>Issued</th><th>Due</th><th>Status</th></tr><tr th:each="l:${loans}"><td th:text="${l.user.username}"></td><td th:text="${l.book.title}"></td><td th:text="${l.issueDate}"></td><td th:text="${l.dueDate}"></td><td th:text="${l.returned ? 'Returned' : 'Issued'}"></td></tr></table></main></body></html>
