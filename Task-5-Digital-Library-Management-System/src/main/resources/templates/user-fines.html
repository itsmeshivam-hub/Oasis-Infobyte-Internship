<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>My Fines</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><h1>My Fines</h1><table><tr><th>Book</th><th>Amount</th><th>Created</th><th>Status</th></tr><tr th:each="f:${fines}"><td th:text="${f.loan.book.title}"></td><td th:text="${'₹'+f.amount}"></td><td th:text="${f.createdDate}"></td><td th:text="${f.paid ? 'Paid' : 'Unpaid'}"></td></tr></table><p>Fine rate: ₹5 per overdue day. Contact admin to record payment.</p></main></body></html>
