<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Manage Books</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><h1>Manage Books</h1><div th:replace="~{fragments :: messages}"></div><a class="btn" href="/admin/books/new">Add book</a>
<table><tr><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Quantity</th><th>Available</th><th>Actions</th></tr><tr th:each="b:${books}"><td th:text="${b.title}"></td><td th:text="${b.author}"></td><td th:text="${b.isbn}"></td><td th:text="${b.category}"></td><td th:text="${b.quantity}"></td><td th:text="${b.availableQuantity}"></td><td><a th:href="@{/admin/books/edit/{id}(id=${b.id})}">Edit</a><form class="inline" method="post" th:action="@{/admin/books/delete/{id}(id=${b.id})}"><button class="danger">Delete</button></form></td></tr></table></main></body></html>
