<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Fines</title><link rel="stylesheet" href="/css/style.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><h1>Fine Management</h1><div th:replace="~{fragments :: messages}"></div><table><tr><th>Member</th><th>Book</th><th>Amount</th><th>Status</th><th>Action</th></tr><tr th:each="f:${fines}"><td th:text="${f.user.username}"></td><td th:text="${f.loan.book.title}"></td><td th:text="${'₹'+f.amount}"></td><td th:text="${f.paid ? 'Paid' : 'Unpaid'}"></td><td><form th:if="${!f.paid}" method="post" th:action="@{/admin/fines/pay/{id}(id=${f.id})}"><button>Mark paid</button></form></td></tr></table></main></body></html>
